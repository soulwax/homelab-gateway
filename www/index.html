<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>madtec.org</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg"></canvas>

  <main>
    <div class="card">
      <div class="status-dot"></div>
      <h1>madtec<span>.org</span></h1>
      <p class="subtitle">Server is alive.</p>

      <div class="info-grid">
        <div class="info-item">
          <span class="label">your ip</span>
          <span class="value" id="visitor-ip">resolving…</span>
        </div>
        <div class="info-item">
          <span class="label">server time</span>
          <span class="value" id="clock">--:--:--</span>
        </div>
        <div class="info-item">
          <span class="label">uptime</span>
          <span class="value" id="uptime">0s</span>
        </div>
        <div class="info-item">
          <span class="label">hostname</span>
          <span class="value">madtec.org</span>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
